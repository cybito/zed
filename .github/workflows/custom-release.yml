name: Custom release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: custom-release-${{ github.repository }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test Zed platform build dispatch
        run: bash .github/scripts/custom-release-regressions.sh

      - id: identity
        env:
          EXPECTED_REPOSITORY: cybito/zed
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          release = event['release']
          tag = release['tag_name']
          def validate_tag(repo, tag, draft, cwd=None):
              if repo != 'cybito/zed' or draft or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-custom\.[1-9][0-9]*', tag):
                  raise ValueError('invalid release event')
              sha = subprocess.check_output(['git','rev-parse','refs/tags/' + tag + '^{commit}'],cwd=cwd,text=True).strip()
              subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/custom'],cwd=cwd,check=True)
              return sha
          # Boundary regressions exercise real, isolated Git ancestry, not workflow text.
          import tempfile
          with tempfile.TemporaryDirectory() as directory:
              def fixture(*args):
                  return subprocess.check_output(['git',*args],cwd=directory,text=True).strip()
              fixture('init','-b','custom')
              fixture('config','user.email','fixture@example.invalid')
              fixture('config','user.name','fixture')
              fixture('commit','--allow-empty','-m','base')
              base = fixture('rev-parse','HEAD')
              fixture('tag','v1.18.0-custom.1')
              fixture('update-ref','refs/remotes/origin/custom',base)
              assert validate_tag('cybito/zed','v1.18.0-custom.1',False,directory) == base
              fixture('checkout','-b','upstream-only')
              fixture('commit','--allow-empty','-m','upstream-only')
              fixture('tag','v1.18.0-custom.2')
              for bad in ['v1.18.0-custom.2','v1.18.0','v1.18.0-custom.0','$(touch PWNED)']:
                  try: validate_tag('cybito/zed',bad,False,directory)
                  except (ValueError,subprocess.CalledProcessError): pass
                  else: raise AssertionError('invalid tag accepted: ' + bad)
              assert not (Path(directory)/'PWNED').exists()
          if os.environ['GITHUB_REPOSITORY'] != os.environ['EXPECTED_REPOSITORY']:
              raise SystemExit('wrong repository')
          # Reject the name before passing it even as a Git argv element.
          if release.get('draft') or release.get('assets') or not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-custom\.[1-9][0-9]*',tag):
              raise SystemExit('invalid release event or attached GitHub assets')
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          subprocess.run(['git','fetch','origin','refs/heads/custom:refs/remotes/origin/custom', '+refs/tags/' + tag + ':refs/tags/' + tag],check=True)
          sha = validate_tag(os.environ['GITHUB_REPOSITORY'],tag,release['draft'])
          if git('rev-parse','HEAD') != sha:
              raise SystemExit('checkout is not exact release tag commit')
          for path in ['.github/workflows/custom-release.yml','.github/scripts/custom-release.sh','.github/scripts/package-release.py']:
              git('cat-file','-e',sha + ':' + path)
          subprocess.run(['git','checkout','--detach',sha],check=True)
          version = subprocess.check_output(['script/get-crate-version','zed'],text=True).strip()
          if not tag.startswith('v' + version + '-custom.') or Path('crates/zed/RELEASE_CHANNEL').read_text().strip() != 'dev':
              raise SystemExit('release version/channel differs from source')
          import importlib.util
          from unittest.mock import patch
          spec = importlib.util.spec_from_file_location('package_release','.github/scripts/package-release.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          with tempfile.TemporaryDirectory() as fixture_dir:
              output = Path(fixture_dir) / 'existing'
              assets = [
                  {'name':helper.asset_name(tag,'linux','release.json'),'size':1},
                  {'name':helper.asset_name(tag,'linux','SHA256SUMS'),'size':1},
              ]
              with patch.object(helper, 'release_assets', return_value=[]):
                  assert helper.check(tag,sha,'linux',output) == {'exists':False}
              with patch.object(helper, 'release_assets', return_value=assets), patch.object(helper,'remote_package',return_value=None):
                  assert helper.check(tag,sha,'linux',Path(fixture_dir)/'partial') == {'exists':False}
              with patch.object(helper, 'release_assets', side_effect=RuntimeError('network unavailable')):
                  try: helper.check(tag,sha,'linux',Path(fixture_dir)/'failed')
                  except RuntimeError: pass
                  else: raise AssertionError('network failure treated as absent assets')
              left = Path(fixture_dir)/'local'
              right = Path(fixture_dir)/'remote'
              left.mkdir(); right.mkdir()
              (left/'package').write_bytes(b'new bytes')
              (right/'package').write_bytes(b'new bytes')
              helper.require_matching_bytes(left/'package',right/'package')
              (right/'package').write_bytes(b'old bytes')
              try: helper.require_matching_bytes(left/'package',right/'package')
              except ValueError: pass
              else: raise AssertionError('mismatching existing asset accepted')
              package = Path(fixture_dir)/'package'
              package.mkdir()
              payloads = {
                  f'zed-{tag}-linux-arm64.tar.gz': b'archive',
                  f'zed-remote-server-{tag}-linux-arm64.gz': b'remote',
              }
              for name, data in payloads.items(): (package/name).write_bytes(data)
              receipt = dict(schema=1,project='zed',source_repo=helper.REPO,source_commit=sha,release_tag=tag,platform='linux',architecture='arm64',toolchains={'rust':'1.97.1'},files=[dict(name=n,sha256=helper.digest(b),size=len(b)) for n,b in payloads.items()])
              (package/'release.json').write_text(json.dumps(receipt))
              names = sorted(list(payloads) + ['release.json'])
              (package/'SHA256SUMS').write_text(''.join(f'{helper.digest((package/n).read_bytes())}  {n}\n' for n in names))
              helper.validate_package(package,tag,sha,'linux')
              try: helper.validate_package(package,tag,'0'*40,'linux')
              except ValueError: pass
              else: raise AssertionError('mismatching source identity accepted')
              (package/next(iter(payloads))).write_bytes(b'corrupt')
              try: helper.validate_package(package,tag,sha,'linux')
              except ValueError: pass
              else: raise AssertionError('checksum mismatch accepted')
              from types import SimpleNamespace
              for name, data in payloads.items(): (package/name).write_bytes(data)
              (package/'SHA256SUMS').write_text(''.join(f'{helper.digest((package/n).read_bytes())}  {n}\n' for n in names))
              remotely_saved = {helper.asset_name(tag,'linux','release.json'):(package/'release.json').read_bytes()}
              remote_assets = [{'name':name,'size':len(data)} for name,data in remotely_saved.items()]
              uploads = []
              def fake_gh(*command, **kwargs):
                  assert command[0] == 'gh'
                  if command[1:3] == ('release','upload'):
                      assert '--clobber' not in command
                      uploads.extend(command)
                      for source in command[4:command.index('--repo')]:
                          path = Path(source)
                          remotely_saved[path.name] = path.read_bytes()
                  elif command[1:3] == ('release','download'):
                      assert command[4:6] == ('--repo','cybito/zed')
                      directory = Path(command[command.index('--dir')+1])
                      patterns = [command[i+1] for i,value in enumerate(command[:-1]) if value == '--pattern']
                      for asset_name, data in remotely_saved.items():
                          if asset_name in patterns: (directory/asset_name).write_bytes(data)
                  else: raise AssertionError('unexpected gh invocation: ' + repr(command))
                  return b''
              published = Path(fixture_dir)/'published'
              with patch.object(helper,'release_assets',return_value=remote_assets), patch.object(helper,'run',side_effect=fake_gh):
                  result = helper.publish(SimpleNamespace(directory=package,output_dir=published,tag=tag,commit=sha,platform='linux'))
              assert len(uploads) > 0 and set(remotely_saved) == {helper.asset_name(tag,'linux',name) for name in [*payloads,'release.json','SHA256SUMS']}
              assert len(result['assets']) == 4
              fresh_assets = {}
              def fake_fresh_gh(*command, **kwargs):
                  if command[1:3] == ('release','upload'):
                      assert '--clobber' not in command
                      for source in command[4:command.index('--repo')]:
                          path = Path(source); fresh_assets[path.name] = path.read_bytes()
                  elif command[1:3] == ('release','download'):
                      directory = Path(command[command.index('--dir')+1])
                      patterns = [command[i+1] for i,value in enumerate(command[:-1]) if value == '--pattern']
                      for asset_name, data in fresh_assets.items():
                          if asset_name in patterns: (directory/asset_name).write_bytes(data)
                  else: raise AssertionError('unexpected fresh-release gh invocation: ' + repr(command))
                  return b''
              fresh_output = Path(fixture_dir)/'published-empty'
              with patch.object(helper,'release_assets',return_value=[]), patch.object(helper,'run',side_effect=fake_fresh_gh):
                  fresh_result = helper.publish(SimpleNamespace(directory=package,output_dir=fresh_output,tag=tag,commit=sha,platform='linux'))
              assert len(fresh_result['assets']) == 4
              assert {path.name for path in fresh_output.iterdir()} == set(payloads) | {'release.json','SHA256SUMS'}
              assert helper.asset_name(tag,'linux','release.json') == tag + '-linux-release.json'
              assert helper.MAX_FILE_SIZE == 2 * 1024**3 and helper.MAX_ASSETS == 1000
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('sha=' + sha + '\ntag=' + tag + '\n')
          PY
  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: custom-build-${{ github.repository }}-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check existing release assets
        id: check
        run: |
          python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --output-dir "$RUNNER_TEMP/existing" > "$RUNNER_TEMP/check.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP'])/'check.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('exists=' + str(value['exists']).lower() + '\n')
          if value['exists']:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
                  output.write('Reused verified GitHub release assets: ' + ', '.join('`'+n+'`' for n in value['assets']) + '\n')
          PY
      - name: Install Rust 1.97.1
        if: steps.check.outputs.exists == 'false'
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build, install and native GUI smoke
        if: steps.check.outputs.exists == 'false'
        run: bash .github/scripts/custom-release.sh build "$PLATFORM" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/build"
      - name: Upload GUI smoke diagnostics
        if: always() && steps.check.outputs.exists != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.validate.outputs.tag }}-${{ matrix.platform }}-arm64-smoke
          path: ${{ runner.temp }}/build/diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package release
        if: steps.check.outputs.exists == 'false'
        run: python3 .github/scripts/package-release.py pack --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --input-dir "$RUNNER_TEMP/build" --output-dir "$RUNNER_TEMP/package"
      - name: Publish assets and verify GitHub readback
        if: steps.check.outputs.exists == 'false'
        run: python3 .github/scripts/package-release.py publish --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --directory "$RUNNER_TEMP/package" --output-dir "$RUNNER_TEMP/published"
      - name: Confirm complete package after reuse
        if: steps.check.outputs.exists == 'true'
        run: python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --output-dir "$RUNNER_TEMP/verified"
  summarize:
    needs: [validate, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: cybito/zed
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Verify assets and preserve release notes
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          tag, sha = os.environ['RELEASE_TAG'], os.environ['SOURCE_SHA']
          assets = json.loads(subprocess.check_output(['gh','release','view',tag,'--repo','cybito/zed','--json','assets'],text=True))['assets']
          if len(assets) > 1000: raise SystemExit('GitHub release asset limit exceeded')
          links = []
          for platform in ('darwin','linux'):
              out = root/platform
              out.mkdir()
              result = json.loads(subprocess.check_output(['python3','.github/scripts/package-release.py','check','--tag',tag,'--commit',sha,'--platform',platform,'--output-dir',str(out)],text=True))
              if not result['exists']: raise SystemExit('missing platform assets')
              for name in result['assets']:
                  asset = next(a for a in assets if a['name'] == name)
                  links.append((platform, name, asset['browser_download_url']))
          release = json.loads(subprocess.check_output(['gh','api','repos/cybito/zed/releases/tags/' + tag],text=True))
          start, end = '<!-- custom-builds:start -->', '<!-- custom-builds:end -->'
          body = release.get('body') or ''
          if (start in body) != (end in body) or body.count(start) > 1 or body.count(end) > 1: raise SystemExit('malformed notes block')
          block = start + '\n## Custom ARM64 installations\n\nSource: `' + sha + '`; release: `' + tag + '`\n\n'
          for platform, name, url in links: block += '**' + platform + '**: [' + name + '](' + url + ')\n\n'
          block += end
          if start in body:
              a, b = body.index(start), body.index(end)
              if b < a: raise SystemExit('malformed notes block')
              body = body[:a] + block + body[b+len(end):]
          else: body = body.rstrip() + '\n\n' + block
          subprocess.run(['gh','api','--method','PATCH','repos/cybito/zed/releases/' + str(release['id']),'--input','-'],input=json.dumps({'body':body}),text=True,check=True)
          PY
